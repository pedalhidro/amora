<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Servida também em /imagens/lista/<slug>[/<n>] (álbum): o base faz as URLs
     relativas (./lib/…, ./data/…, ./photos/…, fetch('./update-…')) resolverem
     na raiz do host, como no index.html. `new URL(rel, location.href)` NÃO
     respeita o base — use document.baseURI. -->
<base href="/">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagens — Pedal Hidrográfico</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
  /* Tema herdado do censo.html (mesma paleta escura) para casar visualmente. */
  :root {
    --bg: #fafbfc;
    --panel: #ffffff;
    --surface: #eef1f4;
    --text: #101820;
    --muted: #4a5867;
    --accent: #c2410c;
    --accent-hover: #9a3412;
    --border: #c6ced6;
    --danger: #b3431e;
    --danger-hover: #922f0f;
  }
  * { box-sizing: border-box; }
  /* O atributo `hidden` precisa vencer os `display:flex/block` dos seletores de
     classe (.modal/.lightbox/.selbar/.toolbar) — senão eles aparecem no boot
     mesmo marcados hidden. Toda a visibilidade desses blocos é via `.hidden`. */
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { padding: 12px; margin: 0; }
  /* A barra de ação inferior (e o espaço p/ ela) só existe no toque; no desktop
     as ações vêm do menu de contexto (botão direito). */
  body.touch-ui.select-mode { padding-bottom: 76px; }

  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-bottom: 10px; }
  header h1 { margin: 0; font-size: 22px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header a { color: var(--accent); text-decoration: none; margin-left: auto; }
  header a:hover { color: var(--accent-hover); }

  #status { color: var(--muted); padding: 10px 0; }
  .err { color: #b3261e; }
  .ok  { color: #1a7f4b; }
  .muted { color: var(--muted); }

  /* ── Botões genéricos ─────────────────────────────────────────────────── */
  .btn {
    display: inline-block; padding: 6px 12px; border-radius: 6px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:disabled:hover { border-color: var(--border); color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); color: #fff; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; }
  .btn-ghost { background: transparent; }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Toolbar (sticky) ─────────────────────────────────────────────────── */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(16, 24, 32, .15);
  }
  .tb-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-row + .tb-row { margin-top: 8px; }
  .tb-label { color: var(--muted); font-size: 12px; }
  .tb-spacer { flex: 1 1 auto; }
  /* Barra sempre visível (toggle + selecionar) + corpo recolhível. */
  .tb-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tb-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .tb-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .tb-toggle .chev { transition: transform .15s; display: inline-block; }
  .toolbar.collapsed .tb-toggle .chev { transform: rotate(-90deg); }
  .tb-body { margin-top: 8px; }
  .toolbar.collapsed .tb-body { display: none; }

  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .segmented button {
    background: var(--surface); color: var(--text); border: none; padding: 6px 12px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .segmented button + button { border-left: 1px solid var(--border); }
  .segmented button.active { background: var(--accent); color: #fff; }
  .segmented button:hover:not(.active) { color: var(--accent); }
  /* Segmento de ÍCONES (toggle de layout estilo Apple Fotos). */
  .iconseg button { display: inline-flex; align-items: center; justify-content: center; padding: 5px 9px; }
  .iconseg svg { display: block; }
  /* Stepper de zoom das miniaturas (− / +). */
  .zoomctl { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .zoomctl button {
    width: 30px; height: 32px; background: var(--surface); color: var(--text);
    border: none; font-size: 17px; line-height: 1; cursor: pointer;
  }
  .zoomctl button + button { border-left: 1px solid var(--border); }
  .zoomctl button:hover:not(:disabled) { color: var(--accent); }
  .zoomctl button:disabled { opacity: .4; cursor: default; }

  .sel-count { color: var(--muted); font-size: 12px; }

  /* Facetas — controles compactos rotulados */
  .tb-facets { align-items: flex-end; }
  .facet { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
  .facet > span, .facet > legend { text-transform: uppercase; letter-spacing: .03em; font-size: 10px; }
  .facet input[type="date"], .facet input[type="number"] {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 6px; font-size: 12px; min-height: 32px;
  }
  /* Faixas (data / kJ): slider de duas alças + campos nas pontas. */
  .range-block { display: flex; align-items: center; gap: 6px; }
  .range-end {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 5px; font-size: 11px; min-height: 30px;
  }
  .facet-range input[type="date"].range-end { width: 118px; }
  .range-num { width: 52px; }
  /* Slider de duas alças: dois <input type=range> sobrepostos; só as alças
     capturam clique (pointer-events), pra ambas serem arrastáveis. */
  .dual { position: relative; width: 130px; height: 28px; flex: none; }
  .dual::before { content: ''; position: absolute; left: 0; right: 0; top: 13px; height: 3px; background: var(--border); border-radius: 2px; }
  .dual-fill { position: absolute; top: 13px; height: 3px; background: var(--accent); border-radius: 2px; }
  .dual input[type="range"] {
    position: absolute; top: 0; left: 0; width: 100%; height: 28px; margin: 0;
    -webkit-appearance: none; appearance: none; background: none; pointer-events: none;
  }
  .dual input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); cursor: pointer;
  }
  .dual input[type="range"]::-moz-range-thumb {
    pointer-events: auto; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); border: 2px solid #fff; cursor: pointer;
  }
  .dual input[type="range"]::-moz-range-track { background: none; }
  .facet-wd {
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px 6px; margin: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .facet-wd .wd-boxes { display: flex; gap: 6px; flex-wrap: wrap; }
  .facet-wd label { display: inline-flex; align-items: center; gap: 3px; color: var(--text); font-size: 12px; text-transform: none; }
  .facet-wd input { accent-color: var(--accent); }

  /* Tom Select — tema escuro (o CSS vendido é claro por padrão). */
  .facet .ts-wrapper { min-width: 150px; max-width: 230px; }
  .ts-wrapper { color: var(--text); }
  .ts-control {
    background: var(--surface) !important; color: var(--text);
    border: 1px solid var(--border) !important; border-radius: 6px !important;
    box-shadow: none !important; min-height: 32px; font-size: 12px;
  }
  .ts-control input, .ts-control input::placeholder { color: var(--muted) !important; }
  .ts-control > input { color: var(--text) !important; }
  .ts-wrapper.multi .ts-control .item {
    background: var(--accent); color: #fff; border-radius: 4px;
  }
  .ts-wrapper.multi .ts-control .item .remove { border-left-color: rgba(0, 0, 0, .2); }
  /* Valores (chips) das facetas de seleção menores — cabem mais por linha. */
  .facet .ts-control .item { font-size: 10px; padding: 0 5px; line-height: 1.5; }
  /* O tom-select.min.css é carregado DEPOIS deste <style> (link abaixo), então
     nas empatadas de especificidade o CSS vendido (tema claro) vence — por isso
     as opções do dropdown precisam de !important pra não ficarem texto escuro
     sobre fundo escuro. Fundo igual ao da caixa SPARQL (var(--surface)). */
  .ts-dropdown {
    background: var(--surface) !important; color: var(--text) !important;
    border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  .ts-dropdown .option {
    color: var(--text) !important; background: transparent !important;
    font-size: 11px; padding: 5px 9px;
  }
  .ts-dropdown .option.active,
  .ts-dropdown .active { background: var(--accent) !important; color: #fff !important; }
  .ts-dropdown .create,
  .ts-dropdown .no-results,
  .ts-dropdown .optgroup-header { color: var(--muted) !important; }
  .ts-dropdown .create:hover { color: #fff !important; }

  /* Avançado (SPARQL) */
  .adv { margin-top: 8px; }
  .adv summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .adv summary:hover { color: var(--text); }
  .adv .flag { color: var(--accent); font-weight: 600; margin-left: 6px; }
  #adv-sparql {
    width: 100%; min-height: 120px; margin-top: 8px; resize: vertical;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; font: 11px/1.5 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .adv-actions { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .query-status { color: var(--muted); font-size: 12px; }
  #adv-error { margin-top: 8px; font-size: 12px; }

  /* ── Linha do tempo ───────────────────────────────────────────────────── */
  .timeline {
    display: flex; align-items: flex-start; gap: 0;
    margin: 8px -12px 0; padding: 8px 12px 4px;
    border-top: 1px solid var(--border);
    overflow-x: auto; overflow-y: hidden; scrollbar-width: thin;
    background-image: linear-gradient(var(--border), var(--border));
    background-size: 100% 2px; background-position: 0 13px; background-repeat: no-repeat;
  }
  .tl-mark {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 2px 10px; font-size: 11px; white-space: nowrap; position: relative;
  }
  .tl-mark .tl-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--surface);
    border: 2px solid var(--muted); transition: transform .1s, background .1s, border-color .1s;
  }
  .tl-mark:hover { color: var(--text); }
  .tl-mark:hover .tl-dot { border-color: var(--accent); }
  .tl-mark.active { color: var(--accent); font-weight: 700; }
  .tl-mark.active .tl-dot { background: var(--accent); border-color: var(--accent); transform: scale(1.35); }
  .tl-mark .tl-lbl { max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  /* Âncora dos grupos abaixo do cabeçalho fixo (toolbar + timeline). */
  .group { scroll-margin-top: 220px; }

  /* ── Grade estilo Apple Fotos ─────────────────────────────────────────── */
  /* touch-action: pan-x pan-y => o navegador ainda rola com 1 dedo, mas cede o
     gesto de pinça (2 dedos) pra gente controlar o zoom das miniaturas. */
  .gallery { display: block; position: relative; touch-action: pan-x pan-y; }
  /* Isola a View Transition (ver withViewTransition() no JS) só na galeria —
     senão o crossfade "root" pega a página inteira (topbar, filtros…) junto. */
  #gallery { view-transition-name: gallery; }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
      animation: none !important;
    }
  }
  /* Modo contínuo: overlay dos polígonos de grupo (não intercepta cliques). */
  .group-overlay { position: absolute; pointer-events: none; z-index: 3; }
  .group-chip {
    position: absolute; pointer-events: none; z-index: 4;
    background: rgba(0, 0, 0, 0.72); color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 5px;
    padding: 1px 6px; font-size: 11px; font-weight: 600; max-width: 60%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Botão-toggle de ícone ("Contínuo"). */
  .icon-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 32px; padding: 0;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer;
  }
  .icon-toggle svg { display: block; }
  .icon-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .icon-toggle.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 15px; }
  .group { margin-bottom: 20px; }
  .group-header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg); padding: 8px 2px; margin-bottom: 6px;
    display: flex; align-items: baseline; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .group-header .g-title { font-size: 15px; font-weight: 700; }
  .group-header .g-count { color: var(--muted); font-size: 12px; }
  .tiles {
    display: grid; grid-template-columns: repeat(var(--cols, 5), 1fr); gap: 3px;
  }
  .tile {
    position: relative; aspect-ratio: 1 / 1; border-radius: 3px; overflow: hidden;
    background: var(--surface); cursor: pointer; border: 1px solid var(--border);
    /* Zoom (+/−) muda --cols, o que muda a largura de cada tile via grid — a
       altura segue sozinha (aspect-ratio). Em colagem, layoutJustified() põe
       width/height inline; a transição também suaviza essa troca. */
    transition: width 0.22s ease, height 0.22s ease;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile:hover { border-color: var(--accent); }
  /* Modo colagem: linhas justificadas (estilo Google Fotos) — as imagens ficam
     no aspect-ratio real e cada linha preenche a largura toda. layoutJustified()
     define width/height inline de cada tile; a última linha fica na altura-alvo
     (não estica) pra não distorcer poucos itens. */
  .gallery.collage .tiles { display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start; }
  .gallery.collage .tile { aspect-ratio: auto; width: auto; }
  .tile.no-img::after {
    content: '🖼'; position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--muted); font-size: 24px; background: var(--surface);
  }
  .tile .badge {
    position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.6); color: #fff;
    border-radius: 4px; padding: 0 6px; font-size: 12px; line-height: 18px;
  }
  .tile .check {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid #fff; background: rgba(0,0,0,.4); display: none;
  }
  /* Check circle só no toque (smartphone). No desktop a seleção é só o realce. */
  body.touch-ui .gallery.select-mode .tile .check { display: block; }
  .tile.selected { outline: 3px solid var(--accent); outline-offset: -3px; }
  .tile.selected .check { background: var(--accent); border-color: #fff; }
  .tile.selected .check::after {
    content: '✓'; color: #fff; font-size: 13px; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Lightbox ─────────────────────────────────────────────────────────── */
  /* pan-y: o navegador cuida da rolagem vertical e do pinch; o arrasto
     horizontal fica pro gesto de trocar de foto (wireLightboxSwipe). */
  .lightbox { position: fixed; inset: 0; z-index: 100; display: flex; touch-action: pan-y pinch-zoom; }
  /* fixed (não absolute): no celular o .lightbox rola (foto + painel não cabem
     numa tela) e o fundo/× têm que ficar parados cobrindo a viewport. */
  .lb-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.86); }
  .lb-close {
    position: fixed; top: 12px; right: 14px; z-index: 3; background: transparent;
    border: none; color: #fff; font-size: 34px; line-height: 1; cursor: pointer;
  }
  /* Anterior/próxima (setas no desktop; no toque é o gesto de deslizar) e o
     contador "n / total" da sequência que está na tela. */
  .lb-nav {
    position: fixed; top: 50%; transform: translateY(-50%); z-index: 3;
    width: 44px; height: 64px; border: none; border-radius: 8px; cursor: pointer;
    background: rgba(0,0,0,.35); color: #fff; font-size: 34px; line-height: 1;
  }
  .lb-nav:hover { background: rgba(0,0,0,.6); }
  .lb-prev { left: 8px; }
  .lb-next { right: 8px; }
  body.touch-ui .lb-nav { display: none; }
  .lb-count {
    position: fixed; top: 18px; left: 16px; z-index: 3; color: #fff; font-size: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none;
  }
  .lb-content {
    position: relative; z-index: 2; margin: auto; display: flex; gap: 16px;
    max-width: 96vw; max-height: 94vh; padding: 16px; flex-wrap: wrap;
    align-items: center; justify-content: center;
  }
  .lb-media { flex: 1 1 420px; min-width: 0; display: flex; align-items: center; justify-content: center; }
  .lb-media img, .lb-media video {
    max-width: 100%; max-height: 84vh; border-radius: 8px; display: block; background: #000;
  }
  /* large.jpg de uploads pré-fix carrega Orientation no EXIF, mas os pixels já
     vêm na orientação visual (canvas re-encode bakes it in) — ignorar evita
     rotação dupla. Mesma lógica já aplicada nos thumbs/popups do mapa. */
  .lb-media img { image-orientation: none; }
  .lb-media audio { width: 100%; margin-top: 8px; }
  .lb-panel {
    flex: 0 1 320px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; max-height: 84vh; overflow: auto;
  }
  .lb-meta dl { margin: 0 0 12px; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; }
  .lb-meta dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  .lb-meta dd { margin: 0; font-size: 13px; word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 1px 8px; font-size: 11px; color: var(--muted);
  }
  .lb-lists { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
  .lb-lists .facet { margin-bottom: 8px; }
  .lb-lists-hint { font-style: normal; color: var(--muted); font-weight: 400; text-transform: none; }
  .lb-lists-status { font-size: 12px; color: var(--muted); min-height: 16px; display: block; }
  .lb-lists-status.ok { color: #1a7f4b; }
  .lb-panel .btn { width: 100%; margin-top: 8px; }
  #lb-error { margin-top: 8px; font-size: 12px; }

  /* ── Barra de ação da seleção (fixa embaixo) ──────────────────────────── */
  .selbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: var(--panel); border-top: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center; padding: 7px 12px;
    box-shadow: 0 -2px 12px rgba(16, 24, 32, .16);
  }
  .selbar-actions { display: flex; gap: 18px; }
  .selbar .btn { padding: 5px 9px; font-size: 16px; }
  @media (max-width: 760px) {
    /* Compacto: só ícones grandes o suficiente pra tocar. */
    .selbar { padding: 6px 8px; }
    .selbar-actions { gap: 14px; }
    .selbar .btn { padding: 6px 10px; font-size: 17px; }
  }

  /* ── Menu de contexto (botão direito) ─────────────────────────────────── */
  .ctx-menu {
    position: fixed; z-index: 130; min-width: 190px; padding: 5px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    box-shadow: 0 6px 24px rgba(16, 24, 32, .18); display: flex; flex-direction: column; gap: 1px;
  }
  .ctx-menu button {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    color: var(--text); font-size: 13px; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  }
  .ctx-menu button:hover { background: var(--surface); }
  .ctx-menu button.danger { color: #b3261e; }
  .ctx-menu button.danger:hover { background: rgba(179, 38, 30, .1); }

  /* ── Aviso passageiro (toast) ─────────────────────────────────────────── */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 140;
    background: var(--panel); border: 1px solid var(--accent); border-radius: 8px;
    padding: 8px 14px; font-size: 13px; box-shadow: 0 4px 16px rgba(16, 24, 32, .18); max-width: 90vw;
  }

  /* ── Modal genérico (adicionar a listas) ──────────────────────────────── */
  .modal { position: fixed; inset: 0; z-index: 120; display: flex; }

<script type="module">
'use strict';
const $  = (q) => document.querySelector(q);
const $$ = (q) => Array.from(document.querySelectorAll(q));

const MQ = window.PhidroMediaQuery;   // publicado por ./lib/media-query.js (clássico)
if (!MQ) {
  $('#status').innerHTML = '<span class="err">Falha: ./lib/media-query.js não carregou.</span>';
  throw new Error('PhidroMediaQuery ausente');
}
const NS = MQ.NS;
const PHD = NS.phd, PH = NS.ph, SCHEMA = NS.schema, MED = NS.med;
// Desktop (mouse, baseado em clique) vs. smartphone (toque): decide o chrome de
// seleção — check circles + barra de ação inferior só no toque; no desktop a
// seleção é só o realce e as ações vêm do menu de contexto (botão direito).
// Detecção DINÂMICA pelo tipo de ponteiro do último gesto — o media query
// estático não pega a simulação de toque do Firefox nem aparelhos híbridos.
let TOUCH_UI = window.matchMedia('(hover: none), (pointer: coarse)').matches;
document.body.classList.toggle('touch-ui', TOUCH_UI);
function setTouchUI(on) {
  if (on === TOUCH_UI) return;
  TOUCH_UI = on;
  document.body.classList.toggle('touch-ui', on);
  if (typeof selectMode !== 'undefined' && selectMode) syncSelectMode();   // barra inferior segue o input
}
window.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') setTouchUI(true);
  else if (e.pointerType === 'mouse') setTouchUI(false);
}, true);
const LIST_PREFIX = NS.lst;   // listas/álbuns (schema:Collection) → lst:<slug>
const TOUR_PREFIX = NS.pas;   // passeios → pas:<slug>

// ── Helpers básicos ─────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
// Escapa string para literal Turtle (usado ao emitir schema:name inline).
function ttlEsc(s) {
  return String(s ?? '').replace(/\\/g, '\\\\').replace(/"/g, '\\"')
    .replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
}
const short = (iri) => String(iri || '').split(/[/#]/).pop();
function debounce(fn, ms) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
// Slug minúsculo p/ IRI de lista nova — IDÊNTICO ao app.js e ao
// upload_images.html, pra que a MESMA lista criada em lugares diferentes case
// na mesma IRI lst:<slug>.
function slugifyList(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'lista';
}
function extDot(url) {
  const m = /\.([a-z0-9]+)(?:\?|#|$)/i.exec(url || '');
  return m ? ('.' + m[1].toLowerCase()) : '';
}
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
  'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
function fmtDateTimePt(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toLocaleString('pt-BR');
}

// ── N3.js (UMD vendored em ./lib/n3.min.js → popula window.N3) ───────────────
async function loadN3() {
  if (window.N3) return window.N3;
  await loadScript('./lib/n3.min.js');
  return window.N3;
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = () => resolve(); s.onerror = () => reject(new Error(`falha ao carregar ${src}`));
    document.head.appendChild(s);
  });
}
// Tom Select — UMD vendored (sem CDN), igual upload_images.html.
async function loadTomSelect() {
  if (window.TomSelect) return window.TomSelect;
  await loadScript('./lib/tom-select.complete.min.js');
  return window.TomSelect;
}
// JSZip carregado sob demanda (só no download) — mesmo CDN dos outros deps pesados.
async function ensureJSZip() {
  if (window.JSZip) return window.JSZip;
  await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  return window.JSZip;
}

// ── Modo embutido (iframe do modal do app) ──────────────────────────────────
// No modal, esconde o header inteiro (título "Imagens", subtítulo e nav "← Mapa")
// — o modal já é claramente a galeria; fecha pelo botão vermelho / clique fora /
// Esc. Standalone (aberto direto), o header aparece normalmente.
function embeddedSetup() {
  if (window.self === window.top) return;
  $('header')?.style.setProperty('display', 'none');
}

// ── Carregamento dos dados (manifesto void → tours.ttl + uploads.ttl) ────────
async function loadData() {
  const N3 = await loadN3();
  const VOID = 'http://rdfs.org/ns/void#';
  let urls = null;
  // 1) tenta o manifesto e segue cada void:dataDump (URL relativa).
  try {
    const manifestUrl = new URL('./data/data_graphs.ttl', document.baseURI).href;
    const res = await fetch(manifestUrl, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`data_graphs.ttl HTTP ${res.status}`);
    const manifestText = await res.text();
    const mQuads = new N3.Parser().parse(manifestText);
    urls = [];
    for (const q of mQuads) {
      if (q.predicate.value === VOID + 'dataDump') {
        urls.push(new URL(q.object.value, manifestUrl).href);
      }
    }
    if (!urls.length) throw new Error('manifesto sem void:dataDump');
  } catch (e) {
    // 2) fallback: baixa os dois dumps conhecidos diretamente.
    console.warn('[imagens] manifesto indisponível, usando fallback:', e.message);
    urls = [
      new URL('./data/tours.ttl', document.baseURI).href,
      new URL('./data/images.ttl', document.baseURI).href,
      new URL('./data/identities.ttl', document.baseURI).href,
      new URL('./data/lists.ttl', document.baseURI).href,
    ];
  }
  // Baixa e concatena o texto de todos os grafos, depois parseia tudo junto.
  // Em PARALELO (eram N round trips em série), concatenados na ordem.
  const parts = (await Promise.all(urls.map((u) =>
    fetch(u, { cache: 'no-cache' })
      .then((r) => { if (!r.ok) { console.warn(`[imagens] ${u}: HTTP ${r.status}`); return null; } return r.text(); })
      .catch((err) => { console.warn(`[imagens] ${u}: ${err.message}`); return null; })
  ))).filter((t) => t != null);
  const text = parts.join('\n\n');
  return new N3.Parser().parse(text);
}

// ── Estado do módulo ─────────────────────────────────────────────────────────
let store = null, model = null, recordByIri = new Map();
let pickSet = null;          // ?pick=… → restringe a galeria a estas mídias (link compartilhado)
let currentGroup = 'tour';
let currentSparql = '';
let isCustom = false;
let galleryLayout = (localStorage.getItem('phidro:galleryLayout') === 'collage') ? 'collage' : 'grid';
// Zoom das miniaturas = nº de fotos (quadradas) por linha. "+" aumpenta (menos
// colunas), "−" diminui (mais colunas). Índice no array; default 5 col/linha.
const GALLERY_COLS = [1, 2, 3, 5, 7, 9, 18, 36];
let galleryZoom = (() => {
  const n = parseInt(localStorage.getItem('phidro:galleryZoom'), 10);
  return (Number.isInteger(n) && n >= 0 && n < GALLERY_COLS.length) ? n : GALLERY_COLS.indexOf(5);
})();
function galleryCols() { return GALLERY_COLS[galleryZoom]; }
// Modo "contínuo": em vez de uma seção (linhas próprias) por grupo, todas as
// miniaturas fluem numa grade só e cada grupo é contornado por um polígono
// (só faz sentido na grade quadrada). Persistido.
let galleryWrap = localStorage.getItem('phidro:galleryWrap') === '1';
let overlayGroups = null;   // groupList do último render contínuo (p/ redesenhar)
let runSeq = 0;
let selectMode = false;
let _forceSelectMode = false;        // botão "Selecionar" ligou a seleção com 0 itens
let selectAnchor = null;             // IRI âncora p/ shift-range (desktop) e drag (celular)
let _downType = null;                // pointerType do último pointerdown na grade
const selected = new Set();          // IRIs de mídia selecionadas
const pendingNewLists = new Map();   // listIri → nome (listas criadas na sessão, ainda não persistidas)
let ftLists, ftAuthors, ftUploaders, ftTours, assignTS, lbTS;
let lbRecord = null;                 // record aberto no lightbox
let _lbSavePending = false;          // há um scheduleLbSave() pendente (debounce) a ser descartado/reforçado ao fechar
let _lbPushed = false;               // openLightbox empurrou uma entrada no histórico (voltar = fechar a foto)
let _lbNavigated = false;            // trocou de foto dentro do lightbox (ao fechar, rola a grade até ela)
let _lbOpenedAt = 0;                 // performance.now() da abertura (engole o click fantasma do toque)

// ── Álbum: /imagens/lista/<slug>[/<n>] ───────────────────────────────────────
// URL legível de uma lista (o backend serve este mesmo arquivo nesse path). Com
// a faceta Listas em UMA lista, a barra de endereço mostra o álbum e, com uma
// foto aberta, /<n> = posição dela no álbum (1-based, ordem de albumSequence).
// Só standalone: embutida no modal do app não há barra de endereço, e mexer no
// histórico do iframe faria o "voltar" do app voltar dentro da galeria.
const STANDALONE = window.self === window.top;
const ALBUM_PATH_RE = /\/imagens\/lista\/([^/]+)(?:\/(\d+))?\/?$/;
const SHARE_ORIGIN = 'https://amora.pedalhidrografi.co';   // links compartilhados apontam pra produção
const PAGE_TITLE = document.title;
let albumSlug = null;                // álbum refletido na barra de endereço (standalone)
let _dataGen = 0;                    // bump a cada loadAndBuild (invalida sequências em voo)
const _albumSeqCache = new Map();    // listIri → Promise<string[]>
const _albumSeqReady = new Map();    // listIri → string[] (IRIs na ordem do álbum), p/ uso síncrono

// Reconstrói store + model + índice a partir dos dados atuais.
async function loadAndBuild() {
  const quads = await loadData();
  store = MQ.makeStore(quads);
  model = MQ.buildMediaRecords(store);
  recordByIri = new Map(model.records.map((r) => [r.iri, r]));
  _dataGen++; _albumSeqCache.clear(); _albumSeqReady.clear();
}

// ── Opções de faceta ─────────────────────────────────────────────────────────
function listOptions() {
  const opts = Object.entries(model.lists).map(([iri, name]) => ({ value: iri, text: name }));
  // inclui listas novas ainda-não-persistidas (criadas nesta sessão)
  for (const [iri, name] of pendingNewLists) if (!model.lists[iri]) opts.push({ value: iri, text: name });
  opts.sort((a, b) => a.text.localeCompare(b.text));
  return opts;
}
function peopleOptions(iriSet) {
  const opts = [...iriSet].map((i) => ({ value: i, text: model.people[i] || short(i) }));
  opts.sort((a, b) => a.text.localeCompare(b.text));
  return opts;
}
function authorIriSet() { const s = new Set(); model.records.forEach((r) => r.authorIris.forEach((i) => s.add(i))); return s; }
function uploaderIriSet() { const s = new Set(); model.records.forEach((r) => r.uploaderIris.forEach((i) => s.add(i))); return s; }
function tourOptions() {
  // Só passeios que TÊM mídia associada — o catálogo tem ~100 passeios mas a
  // maioria ainda não tem foto/vídeo, então não faz sentido oferecê-los no
  // filtro. Ordenadas por data do passeio, mais novas primeiro.
  const withMedia = new Set();
  model.records.forEach((r) => { if (r.tourIri) withMedia.add(r.tourIri); });
  return Object.keys(model.tours)
    .filter((t) => withMedia.has(t))
    .map((t) => ({ value: t, text: model.tourLabel(t), _d: model.tours[t].date || '' }))
    .sort((a, b) => b._d.localeCompare(a._d))
    .map(({ value, text }) => ({ value, text }));
}

// ── Inicialização dos controles de faceta ────────────────────────────────────
function initSelect(sel, options, { placeholder, sortByOrder } = {}) {
  const cfg = { plugins: ['remove_button'], persist: false, options, maxOptions: 2000, placeholder: placeholder || '' };
  // sortByOrder preserva a ordem em que passamos as opções (usado nos passeios,
  // que já vêm por data desc); senão o Tom Select ordena alfabético/relevância.
  if (sortByOrder) cfg.sortField = [{ field: '$order', direction: 'asc' }];
  return new window.TomSelect(sel, cfg);
}
// Criar-na-hora: cunha a IRI lst:<slug> (NÃO o texto cru) — é o valor que
// vai pro backend, que exige o prefixo lst: (listas). Função nomeada pra poder ser
// religada em settings.create sem virar `true` (que usaria o texto como valor).
function mintListOption(input) {
  const iri = LIST_PREFIX + slugifyList(input);
  pendingNewLists.set(iri, input);
  return { value: iri, text: input };
}
// Select de listas COM criar-na-hora (usado no lightbox e no modal de seleção).
function initListSelect(sel, options, initialValues) {
  const ts = new window.TomSelect(sel, {
    plugins: ['remove_button'], persist: false, createOnBlur: true, options,
    maxOptions: 2000, placeholder: 'listas…',
    create: mintListOption,
  });
  if (initialValues && initialValues.length) ts.setValue(initialValues, true);
  return ts;
}

// ── Faixas (data / kJ) com slider de duas alças ──────────────────────────────
let dateMinISO = '2020-01-01', dateMaxISO = '2020-01-01', dateSpanDays = 1, kjMax = 1000;
let dualDate = null, dualKj = null;
function daysBetweenISO(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
function addDaysISO(base, n) { return new Date(Date.parse(base + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10); }
const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function computeRangeBounds() {
  const ds = (model.records || []).map((r) => r.datetime).filter(Boolean).map((d) => d.slice(0, 10)).sort();
  dateMinISO = ds[0] || '2020-01-01';
  dateMaxISO = ds[ds.length - 1] || dateMinISO;
  dateSpanDays = Math.max(1, daysBetweenISO(dateMinISO, dateMaxISO));
  kjMax = Math.max(10, Math.ceil(Math.max(0, ...(model.records || []).map((r) => r.energyKj || 0)) / 10) * 10);
}
// Slider de duas alças ligado aos dois campos de ponta (data ou número). Os
// campos são a fonte de verdade lida por readFacets; o slider os espelha (e
// vice-versa). Alças nas pontas → campo vazio (sem filtro daquele lado).
function makeDualRange(cfg) {
  const dual = document.getElementById(cfg.dualId);
  const lo = dual.querySelector('.dual-lo'), hi = dual.querySelector('.dual-hi');
  const fill = dual.querySelector('.dual-fill');
  const loEnd = $(cfg.loEnd), hiEnd = $(cfg.hiEnd);
  const { sMin, sMax, sStep } = cfg, mid = (sMin + sMax) / 2;
  lo.min = hi.min = sMin; lo.max = hi.max = sMax; lo.step = hi.step = sStep;
  const paint = () => {
    const lv = +lo.value, hv = +hi.value, span = (sMax - sMin) || 1;
    fill.style.left = (lv - sMin) / span * 100 + '%';
    fill.style.width = Math.max(0, (hv - lv) / span * 100) + '%';
    lo.style.zIndex = lv > mid ? 5 : 3; hi.style.zIndex = 4;   // alça arrastável quando juntas
  };
  const applyFromSlider = () => {
    loEnd.value = cfg.toEnd(+lo.value, 'lo');
    hiEnd.value = cfg.toEnd(+hi.value, 'hi');
    paint(); debouncedRebuild();
  };
  lo.addEventListener('input', () => { if (+lo.value > +hi.value) lo.value = hi.value; applyFromSlider(); });
  hi.addEventListener('input', () => { if (+hi.value < +lo.value) hi.value = lo.value; applyFromSlider(); });
  const endsChanged = () => {
    let l = cfg.toSlider(loEnd.value, 'lo'), h = cfg.toSlider(hiEnd.value, 'hi');
    if (l > h) { const t = l; l = h; h = t; }
    lo.value = l; hi.value = h; paint(); debouncedRebuild();
  };
  loEnd.addEventListener('change', endsChanged);
  hiEnd.addEventListener('change', endsChanged);
  const syncFromEnds = () => {
    lo.value = cfg.toSlider(loEnd.value, 'lo'); hi.value = cfg.toSlider(hiEnd.value, 'hi');
    if (+lo.value > +hi.value) { const t = lo.value; lo.value = hi.value; hi.value = t; }
    paint();
  };
  syncFromEnds();
  return { syncFromEnds };
}

function buildFacetControls() {
  ftLists     = initSelect('#f-lists', listOptions(), { placeholder: 'todas' });
  ftAuthors   = initSelect('#f-authors', peopleOptions(authorIriSet()), { placeholder: 'todas' });
  ftUploaders = initSelect('#f-uploaders', peopleOptions(uploaderIriSet()), { placeholder: 'todos' });
  ftTours     = initSelect('#f-tours', tourOptions(), { placeholder: 'todos', sortByOrder: true });
  [ftLists, ftAuthors, ftUploaders, ftTours].forEach((ts) => ts.on('change', debouncedRebuild));

  // Faixas data/kJ: campos nas pontas (digitáveis/selecionáveis) + slider duplo.
  computeRangeBounds();
  $('#f-date-from').min = $('#f-date-to').min = dateMinISO;
  $('#f-date-from').max = $('#f-date-to').max = dateMaxISO;
  $('#f-kj-min').max = $('#f-kj-max').max = kjMax;
  dualDate = makeDualRange({
    dualId: 'dual-date', loEnd: '#f-date-from', hiEnd: '#f-date-to',
    sMin: 0, sMax: dateSpanDays, sStep: 1,
    toEnd: (v, side) => side === 'lo' ? (v <= 0 ? '' : addDaysISO(dateMinISO, v)) : (v >= dateSpanDays ? '' : addDaysISO(dateMinISO, v)),
    toSlider: (str, side) => str ? clampN(daysBetweenISO(dateMinISO, str), 0, dateSpanDays) : (side === 'lo' ? 0 : dateSpanDays),
  });
  dualKj = makeDualRange({
    dualId: 'dual-kj', loEnd: '#f-kj-min', hiEnd: '#f-kj-max',
    sMin: 0, sMax: kjMax, sStep: 10,
    toEnd: (v, side) => side === 'lo' ? (v <= 0 ? '' : v) : (v >= kjMax ? '' : v),
    toSlider: (str, side) => (str !== '' && str != null) ? clampN(+str, 0, kjMax) : (side === 'lo' ? 0 : kjMax),
  });
  $$('#f-weekdays input').forEach((cb) => cb.addEventListener('change', debouncedRebuild));

  // Selects de listas com criar-na-hora (lightbox + modal de seleção).
  assignTS = initListSelect('#assign-select', listOptions(), []);
  lbTS = initListSelect('#lb-lists-select', listOptions(), []);
}

// Re-sincroniza opções de listas após uma mutação (novas listas criadas).
function syncListOptions() {
  const opts = listOptions();
  [ftLists, assignTS, lbTS].forEach((ts) => { if (ts) ts.addOptions(opts); });
}

// ── Leitura das facetas ──────────────────────────────────────────────────────
function readFacets() {
  const num = (sel) => { const v = $(sel).value; return v === '' ? null : Number(v); };
  const weekdays = $$('#f-weekdays input:checked').map((cb) => Number(cb.value));
  return {
    group: currentGroup,
    lists: ftLists ? ftLists.getValue() : [],
    authors: ftAuthors ? ftAuthors.getValue() : [],
    uploaders: ftUploaders ? ftUploaders.getValue() : [],
    tours: ftTours ? ftTours.getValue() : [],
    dateFrom: $('#f-date-from').value || null,
    dateTo: $('#f-date-to').value || null,
    kjMin: num('#f-kj-min'),
    kjMax: num('#f-kj-max'),
    weekdays,
  };
}

// ── Pipeline de consulta ─────────────────────────────────────────────────────
const debouncedRebuild = debounce(rebuildAndRun, 250);

function rebuildAndRun() {
  const facets = readFacets();
  const sparql = MQ.buildQueryFromFacets(facets);
  currentSparql = sparql;
  isCustom = false;
  $('#adv-sparql').value = sparql;
  $('#adv-flag').hidden = true;
  syncAlbumUrl();
  runAndRender(sparql, facets);
}

// Filtro/agrupamento reconstrói o #gallery inteiro (innerHTML) — sem isso, a
// troca é um corte seco. View Transitions tira um "antes"/"depois" e faz um
// crossfade+morph nativo; sem suporte (Safari/Firefox mais antigos), cai pro
// render direto, sem quebrar nada.
// Só com a galeria (antes E depois) de até ~2 telas de altura: o WebKit aloca
// o snapshot do tamanho do elemento INTEIRO, não da parte visível, e repinta
// nele cada imagem carregada decodificada em tamanho cheio — a galeria toda
// (centenas de tiles, ou dezenas em 1 coluna) vira centenas de MB e o Safari
// do iPhone mata a aba. Acima disso, troca seca. `nextTiles` estima o depois.
function withViewTransition(fn, nextTiles) {
  const g = $('#gallery'), cols = galleryCols();
  const nextH = Math.ceil(nextTiles / cols) * (g.clientWidth / cols);
  const maxH = 2 * window.innerHeight;
  if (document.startViewTransition && g.offsetHeight <= maxH && nextH <= maxH) document.startViewTransition(fn);
  else fn();
}
// Nº de tiles que `rows` vai render (o link compartilhado filtra no render).
function tileCount(rows) {
  return pickSet ? rows.filter((r) => r.m && pickSet.has(r.m.value)).length : rows.length;
}

async function runAndRender(sparql, facets) {
  const seq = ++runSeq;
  setQueryStatus('carregando consulta…');   // Comunica é lazy (~1.6 MB) na 1ª vez
  clearError();
  let rows;
  try {
    rows = await MQ.runQuery(store, sparql);
  } catch (e) {
    if (seq !== runSeq) return;
    setQueryStatus('');
    showError('Erro na consulta: ' + e.message);
    return;
  }
  if (seq !== runSeq) return;   // uma consulta mais nova já começou
  setQueryStatus('');
  withViewTransition(() => renderGroups(rows, facets), tileCount(rows));
}

function setQueryStatus(msg) { $('#query-status').textContent = msg; }
function showError(msg) { const el = $('#adv-error'); el.textContent = msg; el.hidden = false; if (!$('#adv').open) $('#adv').open = true; }
function clearError() { const el = $('#adv-error'); el.textContent = ''; el.hidden = true; }

// ── Agrupamento + render da grade ────────────────────────────────────────────
function groupOrderStr(key) {
  // String comparável para ordenar grupos (desc). Vazios vão pro fim.
  if (key.startsWith(TOUR_PREFIX)) return (model.tours[key] && model.tours[key].date) || '';
  if (key === 'sem-passeio' || key === 'sem-data' || key === '') return '';
  return key;
}
function groupLabel(key) {
  if (key.startsWith(TOUR_PREFIX)) return model.tourLabel(key);
  if (key === 'sem-passeio') return 'Sem passeio';
  if (key === 'sem-data') return 'Sem data';
  if (key === '') return 'Todas';
  if (/^\d{4}$/.test(key)) return key;
  if (/^\d{4}-\d{2}$/.test(key)) { const [y, m] = key.split('-'); return `${MESES[+m - 1] || m} de ${y}`; }
  if (/^\d{4}-\d{2}-\d{2}$/.test(key)) {
    const d = new Date(key + 'T00:00:00Z');
    return isNaN(d) ? key : d.toLocaleDateString('pt-BR', { timeZone: 'UTC', day: '2-digit', month: 'long', year: 'numeric' });
  }
  return key;
}

let lastRows = null, lastFacets = null;   // cache p/ re-render sem re-consultar
function rerender() { if (lastRows) withViewTransition(() => renderGroups(lastRows, lastFacets), tileCount(lastRows)); }
// Ordem TOTAL das linhas de uma consulta de facetas: data desc (pelo
// instante), sem data no fim, desempate pelo IRI. O ORDER BY da consulta diz o
// mesmo, mas o Comunica não aplica a 2ª chave de forma confiável (medido:
// mídias com a mesma data, ou sem data, saíam embaralhadas) — e o /<n> do
// álbum precisa de uma ordem exata, que o backend reproduz (_album_sequence)
// pro preview do link. Sort estável: a mesma mídia em dois grupos mantém a
// ordem relativa. Data sem fuso conta como UTC (como no backend).
function canonicalRowOrder(rows) {
  const instant = (iri) => {
    const s = iri && recordByIri.get(iri) && recordByIri.get(iri).datetime;
    if (!s) return null;
    const v = Date.parse(s.length > 10 && !/(?:[zZ]|[+-]\d\d:?\d\d)$/.test(s) ? s + 'Z' : s);
    return Number.isNaN(v) ? null : v;
  };
  return rows.map((row) => {
    const iri = (row.m && row.m.value) || '';
    return { row, iri, t: instant(iri) };
  }).sort((a, b) => {
    if ((a.t == null) !== (b.t == null)) return a.t == null ? 1 : -1;
    if (a.t !== b.t) return b.t - a.t;
    return a.iri < b.iri ? -1 : (a.iri > b.iri ? 1 : 0);
  }).map((x) => x.row);
}
// Linhas da consulta → grupos (dedup por grupo, dia-da-semana no cliente) e
// chaves na ordem de exibição. `pick` = pickSet do link compartilhado (ou
// null); `canonical` = impõe canonicalRowOrder (consultas de facetas — uma
// consulta SPARQL personalizada fica com o ORDER BY dela). Compartilhado pelo
// render e pela ordem canônica do álbum (albumSequence).
function groupRows(rows, facets, pick, canonical) {
  if (canonical) rows = canonicalRowOrder(rows);
  const wds = facets.weekdays || [];
  // Dia-da-semana NÃO existe em SPARQL → filtrado no cliente, aqui.
  const filterWd = wds.length > 0 && wds.length < 7;
  const wdSet = new Set(wds);

  const groups = new Map();       // key → { records:[], seen:Set }
  for (const row of rows) {
    const iri = row.m && row.m.value;
    if (!iri) continue;
    if (pick && !pick.has(iri)) continue;   // link compartilhado: só a seleção
    const rec = recordByIri.get(iri);
    if (!rec) continue;
    if (filterWd && (rec.weekday == null || !wdSet.has(rec.weekday))) continue;
    const gk = (row.group && row.group.value) || '';
    let g = groups.get(gk);
    if (!g) { g = { records: [], seen: new Set() }; groups.set(gk, g); }
    if (g.seen.has(iri)) continue;
    g.seen.add(iri);
    g.records.push(rec);
  }

  const keys = [...groups.keys()].sort((a, b) => {
    const av = groupOrderStr(a), bv = groupOrderStr(b);
    if (!av && !bv) return 0;
    if (!av) return 1;
    if (!bv) return -1;
    return bv.localeCompare(av);   // desc
  });
  return { groups, keys };
}
function renderGroups(rows, facets) {
  lastRows = rows; lastFacets = facets;
  tileLarge = wantLargeTiles();
  const { groups, keys } = groupRows(rows, facets, pickSet, !isCustom);

  const gallery = $('#gallery');
  const total = keys.reduce((n, k) => n + groups.get(k).records.length, 0);
  if (!total) {
    gallery.innerHTML = '<div class="empty">Nenhuma imagem encontrada.</div>';
    buildTimeline([]);
    updateSelUI();
    return;
  }
  const groupList = keys.map((k, idx) => ({
    key: k, id: 'grp-' + idx, label: groupLabel(k), order: groupOrderStr(k),
    count: groups.get(k).records.length,
  }));
  // "Nenhum": sem cabeçalhos de grupo nem linha do tempo — só uma grade contínua.
  const noGroup = currentGroup === 'none';
  // "Contínuo": uma grade/colagem só (miniaturas fluem entre grupos) + polígono
  // por grupo. Funciona tanto na grade quadrada quanto na colagem — o polígono é
  // traçado a partir dos retângulos reais dos tiles (ver drawGroupPolygons).
  const wrapActive = galleryWrap && !noGroup;
  if (wrapActive) {
    const tilesHtml = keys.map((k, gi) =>
      groups.get(k).records.map((r, ri) => tileHtml(r, ri === 0 ? { id: 'grp-' + gi } : null)).join('')
    ).join('');
    const collage = galleryLayout === 'collage';
    gallery.classList.toggle('collage', collage);
    gallery.style.setProperty('--cols', galleryCols());
    gallery.innerHTML = `<div class="tiles wrap-tiles">${tilesHtml}</div><div class="group-overlay" aria-hidden="true"></div>`;
    overlayGroups = groupList;
    if (collage) {
      const wrap = gallery.querySelector('.wrap-tiles');
      layoutJustified(wrap);
      wrap.querySelectorAll('img').forEach((img) => {
        if (img.dataset.relayout) return;
        img.dataset.relayout = '1';
        img.addEventListener('load', scheduleRelayout);   // reflui + refaz contornos
      });
    }
    requestAnimationFrame(() => drawGroupPolygons());
    buildTimeline(groupList);
    updateSelUI();
    return;
  }
  overlayGroups = null;
  const html = keys.map((k, idx) => {
    const recs = groups.get(k).records;
    const tiles = recs.map((r) => tileHtml(r)).join('');
    const header = noGroup ? '' :
      `<div class="group-header"><span class="g-title">${escapeHtml(groupLabel(k))}</span>` +
      `<span class="g-count">${recs.length}</span></div>`;
    return `<section class="group" id="grp-${idx}">${header}<div class="tiles">${tiles}</div></section>`;
  }).join('');
  gallery.innerHTML = html;
  applyGalleryLayout();
  buildTimeline(noGroup ? [] : groupList);
  updateSelUI();
}

// ── Linha do tempo (um marcador por grupo) ───────────────────────────────────
// Rótulo compacto p/ o marcador: passeio → código (ex.: "PH 98"); datas →
// forma curta; sem data/passeio → "—".
function timelineLabel(g) {
  const k = g.key;
  if (k === 'sem-passeio' || k === 'sem-data' || k === '') return '—';
  if (k.startsWith(TOUR_PREFIX)) {
    const t = model.tours[k];
    return (t && t.code) || (t && t.date) || g.label;
  }
  if (/^\d{4}$/.test(k)) return k;
  if (/^\d{4}-\d{2}$/.test(k)) { const [y, m] = k.split('-'); return `${(MESES[+m - 1] || m).slice(0, 3)}/${y.slice(2)}`; }
  if (/^\d{4}-\d{2}-\d{2}$/.test(k)) { const [y, m, d] = k.split('-'); return `${d}/${m}`; }
  return g.label;
}
let timelineGroups = [];
function buildTimeline(groupList) {
  const tl = $('#timeline');
  timelineGroups = groupList.slice();
  if (groupList.length < 2) { tl.hidden = true; tl.innerHTML = ''; return; }
  // Mais antigo à esquerda → mais novo à direita; sem data/passeio (order '')
  // vai pro começo (mais antigo que o mais antigo).
  const asc = groupList.slice().sort((a, b) => {
    if (!a.order && !b.order) return 0;
    if (!a.order) return -1;
    if (!b.order) return 1;
    return a.order.localeCompare(b.order);
  });
  tl.innerHTML = asc.map((g) =>
    `<button type="button" class="tl-mark" data-target="${g.id}" title="${escapeHtml(g.label)} (${g.count})">` +
      `<span class="tl-dot"></span><span class="tl-lbl">${escapeHtml(timelineLabel(g))}</span>` +
    `</button>`).join('');
  tl.hidden = false;
  refreshTimelineActive();
}
function scrollToGroup(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const header = document.querySelector('.toolbar');
  const top = el.getBoundingClientRect().top + window.scrollY - (header ? header.offsetHeight : 0) - 8;
  window.scrollTo({ top, behavior: 'smooth' });
}
// Destaca o marcador do grupo que está no topo da área visível (abaixo do
// cabeçalho fixo) e mantém esse marcador visível na régua.
function refreshTimelineActive() {
  const tl = $('#timeline');
  if (tl.hidden) return;
  const header = document.querySelector('.toolbar');
  const cut = (header ? header.getBoundingClientRect().bottom : 0) + 6;
  // timelineGroups está em ordem da galeria (mais novo primeiro). O grupo ativo
  // é o último (mais antigo) cujo topo já passou pelo cabeçalho; se nenhum
  // passou (galeria no topo), o ativo é o mais novo (timelineGroups[0]).
  let activeId = null;
  for (const g of timelineGroups) {
    const el = document.getElementById(g.id);
    if (el && el.getBoundingClientRect().top <= cut) activeId = g.id;
  }
  if (!activeId && timelineGroups.length) activeId = timelineGroups[0].id; // topo → mais novo
  let activeMark = null;
  tl.querySelectorAll('.tl-mark').forEach((m) => {
    const on = m.dataset.target === activeId;
    m.classList.toggle('active', on);
    if (on) activeMark = m;
  });
  if (activeMark) {
    const mLeft = activeMark.offsetLeft, mRight = mLeft + activeMark.offsetWidth;
    if (mLeft < tl.scrollLeft || mRight > tl.scrollLeft + tl.clientWidth) {
      tl.scrollTo({ left: mLeft - tl.clientWidth / 2 + activeMark.offsetWidth / 2, behavior: 'smooth' });
    }
  }
}

// ── Layout: grade quadrada vs colagem justificada ────────────────────────────
// Aplica o modo atual na grade. No modo colagem, roda o layout justificado e
// (re)anexa os relayouts em cada imagem que carrega (as miniaturas chegam lazy).
function applyGalleryLayout() {
  const gallery = $('#gallery');
  gallery.style.setProperty('--cols', galleryCols());   // zoom → nº de colunas
  const collage = galleryLayout === 'collage';
  gallery.classList.toggle('collage', collage);
  if (!collage) {
    // Limpa os tamanhos inline deixados pela colagem.
    gallery.querySelectorAll('.tile').forEach((t) => { t.style.width = ''; t.style.height = ''; });
    return;
  }
  layoutAllJustified();
  gallery.querySelectorAll('.tile img').forEach((img) => {
    if (img.dataset.relayout) return;
    img.dataset.relayout = '1';
    img.addEventListener('load', scheduleRelayout);
  });
}
const scheduleRelayout = debounce(() => {
  if (galleryLayout === 'collage') layoutAllJustified();
  if (overlayGroups) drawGroupPolygons();   // tiles se moveram → refaz os contornos
}, 80);
function layoutAllJustified() {
  const g = $('#gallery');
  g.querySelectorAll('.group .tiles').forEach((c) => layoutJustified(c));
  const wrap = g.querySelector('.wrap-tiles');   // modo contínuo em colagem
  if (wrap) layoutJustified(wrap);
}
// Empacota os tiles em linhas de altura ~alvo, cada linha esticada pra largura
// toda (larguras ∝ aspect-ratio). A última linha fica na altura-alvo se não
// encher, pra não distorcer poucos itens.
function layoutJustified(container) {
  const tiles = [...container.children];
  const cw = container.clientWidth;
  if (!tiles.length || cw <= 0) return;
  const gap = 3;
  // Altura-alvo derivada do zoom: ~galleryCols() fotos quadradas por linha.
  const cols = galleryCols();
  const targetH = Math.max(24, (cw - (cols - 1) * gap) / cols);
  const ar = (t) => {
    const img = t.querySelector('img');
    const w = img && img.naturalWidth, h = img && img.naturalHeight;
    return (w && h) ? (w / h) : 1;   // 1 (quadrado) até a miniatura carregar
  };
  let i = 0;
  while (i < tiles.length) {
    let j = i, sum = 0;
    while (j < tiles.length) {
      sum += ar(tiles[j]);
      j++;
      if (sum * targetH + (j - i - 1) * gap >= cw) break;   // linha cheia
    }
    const rowTiles = tiles.slice(i, j);
    const sumAr = rowTiles.reduce((a, t) => a + ar(t), 0);
    const avail = cw - (rowTiles.length - 1) * gap;
    const isLast = j >= tiles.length;
    const naturalW = sumAr * targetH + (rowTiles.length - 1) * gap;
    const h = (isLast && naturalW < cw) ? targetH : (avail / sumAr);
    rowTiles.forEach((t) => {
      t.style.height = h + 'px';
      t.style.width = Math.max(1, ar(t) * h) + 'px';
    });
    i = j;
  }
}

// Modo contínuo: desenha um polígono retilíneo por grupo, contornando os tiles
// que ele ocupa na grade/colagem única (que flui entre grupos). Traçado a partir
// dos RETÂNGULOS REAIS dos tiles (offsetLeft/Top/Width/Height), então funciona
// igual na grade quadrada e na colagem justificada. Reflows de imagem re-chamam
// isto via scheduleRelayout.
function drawGroupPolygons() {
  const gallery = $('#gallery');
  const wrap = gallery.querySelector('.wrap-tiles');
  const overlay = gallery.querySelector('.group-overlay');
  if (!wrap || !overlay || !overlayGroups) return;
  const W = wrap.clientWidth, H = wrap.offsetHeight;
  if (W <= 0) return;
  overlay.style.top = wrap.offsetTop + 'px';
  overlay.style.left = wrap.offsetLeft + 'px';
  overlay.style.width = W + 'px';
  overlay.style.height = H + 'px';
  const tiles = [...wrap.children].filter((t) => t.classList && t.classList.contains('tile'));
  const p = 3 / 2;             // folga = metade do gap (fica no meio do vão)
  const EDGE = 2.5;            // tolerância p/ "encostou na borda do conteúdo"
  const LEFT = -p, RIGHT = W + p;
  let start = 0;
  const paths = [], chips = [];
  overlayGroups.forEach((g) => {
    const n = g.count; if (n <= 0) return;
    const gt = tiles.slice(start, start + n); start += n;
    if (!gt.length) return;
    // Agrupa os tiles do grupo em linhas visuais por offsetTop (tiles da mesma
    // linha compartilham o topo). Cada linha vira uma faixa [l,r] × [t,b].
    const rows = [];
    gt.forEach((t) => {
      const top = t.offsetTop, left = t.offsetLeft;
      const right = left + t.offsetWidth, bot = top + t.offsetHeight;
      let row = rows.find((r) => Math.abs(r.t0 - top) < 3);
      if (!row) { row = { t0: top, l: left, r: right, t: top, b: bot }; rows.push(row); }
      else { row.l = Math.min(row.l, left); row.r = Math.max(row.r, right); row.t = Math.min(row.t, top); row.b = Math.max(row.b, bot); }
    });
    rows.sort((a, b) => a.t - b.t);
    const R = rows.map((r) => ({ l: r.l - p, r: r.r + p, t: r.t - p, b: r.b + p }));
    // Vértices em escada (linhas empilhadas), sentido horário desde o topo-esq.
    const V = [];
    V.push([R[0].l, R[0].t], [R[0].r, R[0].t]);
    for (let i = 0; i < R.length; i++) {
      V.push([R[i].r, R[i].b]);
      if (i < R.length - 1) V.push([R[i + 1].r, R[i].b]);   // degrau lateral direito
    }
    const last = R.length - 1;
    V.push([R[last].l, R[last].b]);
    for (let i = last; i >= 0; i--) {
      V.push([R[i].l, R[i].t]);
      if (i > 0) V.push([R[i - 1].l, R[i].t]);              // degrau lateral esquerdo
    }
    // OMITE os segmentos verticais que caem nas bordas esq./dir. do conteúdo (as
    // quebras de linha) — assim a faixa "continua" da direita pra esquerda da
    // linha seguinte. As reentrâncias internas ficam, separando grupos vizinhos.
    const NV = V.length;
    const edgeV = (a, b) => Math.abs(a[0] - b[0]) < 0.5 &&
      (a[0] < LEFT + EDGE || a[0] > RIGHT - EDGE);
    let k0 = 0; for (let i = 0; i < NV; i++) if (edgeV(V[i], V[(i + 1) % NV])) { k0 = i; break; }
    let d = '', open = false, omitted = false;
    for (let m = 0; m < NV; m++) {
      const a = V[(k0 + m) % NV], b = V[(k0 + m + 1) % NV];
      if (edgeV(a, b)) { open = false; omitted = true; continue; }
      if (!open) { d += `M${a[0].toFixed(1)},${a[1].toFixed(1)}`; open = true; }
      d += `L${b[0].toFixed(1)},${b[1].toFixed(1)}`;
    }
    if (!omitted) d += 'Z';
    paths.push(`<path d="${d}" fill="none" stroke="#cfcfcf" stroke-width="2.5" stroke-linejoin="round"/>`);
    // Rótulo: tamanho ∝ altura da 1ª linha; piso legível 8px. Largura limitada à
    // extensão do grupo na 1ª linha (clipa com reticências).
    const r0 = rows[0], rowH = r0.b - r0.t;
    const fs = Math.max(8, Math.min(120, Math.round(rowH * 0.063)));
    const chipMaxW = Math.max(24, (r0.r - r0.l) - 8);
    const padY = Math.max(1, Math.round(fs * 0.12)), padX = Math.max(4, Math.round(fs * 0.4));
    chips.push(
      `<div class="group-chip" style="left:${(r0.l + 4).toFixed(1)}px;top:${(r0.t + 4).toFixed(1)}px;` +
      `font-size:${fs}px;max-width:${chipMaxW.toFixed(0)}px;padding:${padY}px ${padX}px">${escapeHtml(g.label)}</div>`);
  });
  overlay.innerHTML = `<svg width="${W}" height="${H}" style="position:absolute;inset:0;overflow:visible">${paths.join('')}</svg>${chips.join('')}`;
}

// ── Resolução dos tiles: thumb.jpg × large.jpg ───────────────────────────────
// O tile mostra o thumb.jpg (256 px no lado maior → ~192 px úteis no recorte
// quadrado) e só troca pro large.jpg (2400 px, ~17 MB decodificado) quando o
// tile tem mais que ~2× isso em pixels de tela E, em aparelho de toque, cabem
// poucos tiles na tela. Era um srcset "large 2x", e todo celular (DPR 2–3)
// caía no large em TODOS os tiles: o WebKit decodifica em tamanho cheio o que
// está visível (sem subamostrar abaixo de 5 MP) — o álbum de 64 fotos do PH 113
// passava de 1 GB e o Safari do iPhone matava a aba ("A problem repeatedly
// occurred"). Toque = celular/tablet (inclusive iPad com mouse — por isso não
// é o TOUCH_UI, que segue o último ponteiro): lá a aba morre bem antes que num
// desktop.
const THUMB_USEFUL_PX = 192;
const LARGE_DECODED_MB = 17;     // 2400×1800×4
const LARGE_BUDGET_MB = 200;     // teto de larges decodificados na tela (toque)
const MEMORY_TIGHT = navigator.maxTouchPoints > 0;
let tileLarge = false;
function wantLargeTiles() {
  const cw = $('#gallery').clientWidth || document.documentElement.clientWidth;
  const tile = cw / galleryCols();
  if (tile * (window.devicePixelRatio || 1) <= 2 * THUMB_USEFUL_PX) return false;
  if (!MEMORY_TIGHT) return true;   // desktop: memória sobra
  const onScreen = galleryCols() * (window.innerHeight / tile + 1);   // + a linha cortada
  return onScreen * LARGE_DECODED_MB <= LARGE_BUDGET_MB;
}
function tileSrc(rec) {
  return (tileLarge && rec.largeUrl) ? rec.largeUrl : rec.thumbUrl;
}
// Zoom/resize cruzou o limiar: troca o src dos tiles já na grade (o navegador
// segue mostrando a imagem atual até a nova carregar).
function syncTileResolution() {
  const want = wantLargeTiles();
  if (want === tileLarge) return;
  tileLarge = want;
  $$('#gallery .tile img').forEach((img) => {
    const rec = recordByIri.get(img.closest('.tile').dataset.iri);
    if (rec) img.src = tileSrc(rec);
  });
}

function tileHtml(rec, opts) {
  const sel = selected.has(rec.iri) ? ' selected' : '';
  const noImg = rec.thumbUrl ? '' : ' no-img';
  const img = rec.thumbUrl
    ? `<img loading="lazy" src="${escapeHtml(tileSrc(rec))}" alt="" ` +
      `onerror="this.style.display='none';this.parentElement.classList.add('no-img')">`
    : '';
  const badge = rec.kind === 'video' ? `<span class="badge">▶</span>` : '';
  const title = escapeHtml(rec.tourLabel || fmtDateTimePt(rec.datetime) || '');
  const idAttr = opts && opts.id ? ` id="${opts.id}"` : '';   // 1ª do grupo (linha do tempo)
  return (
    `<div class="tile${sel}${noImg}"${idAttr} data-iri="${escapeHtml(rec.iri)}" role="button" tabindex="0" title="${title}">` +
      `${img}${badge}<span class="check"></span>` +
    `</div>`
  );
}

// ── Interação com a grade: seleção estilo Apple Fotos/Finder ─────────────────
// Desktop (mouse): clique = seleciona só ela; Cmd/Ctrl+clique = alterna;
//   Shift+clique = intervalo desde a âncora; duplo-clique / Enter / Espaço =
//   abre; clique fora = limpa; botão direito = menu de contexto.
// Celular (toque): toque = abre (ou alterna, se já há seleção); segurar =
//   entra em seleção; segurar+arrastar = pinta o intervalo; toque fora = limpa.
const LONGPRESS_MS = 450, MOVE_TOL = 10;
let _pressTimer = null, _pressTile = null, _pressXY = null;
let dragSelecting = false, _dragBase = null;

const tileByIri = (iri) => $(`#gallery .tile[data-iri="${(window.CSS && CSS.escape) ? CSS.escape(iri) : iri}"]`);
function markSelected(iri, on) {
  if (on) selected.add(iri); else selected.delete(iri);
  const t = tileByIri(iri); if (t) t.classList.toggle('selected', on);
}
function selectOnly(iri) { clearSelection(false); markSelected(iri, true); selectAnchor = iri; syncSelectMode(); }
function toggleOne(iri) { markSelected(iri, !selected.has(iri)); selectAnchor = iri; syncSelectMode(); }
// Seleção = intervalo [âncora..alvo] na ordem do DOM, unido a `base` (Set ou null).
function selectRange(fromIri, toIri, base) {
  const tiles = $$('#gallery .tile');
  const order = tiles.map((t) => t.dataset.iri);
  let i = order.indexOf(fromIri), j = order.indexOf(toIri);
  if (i < 0 || j < 0) return;
  if (i > j) { const tmp = i; i = j; j = tmp; }
  const baseSet = base || new Set();
  selected.clear();
  tiles.forEach((t, k) => {
    const on = (k >= i && k <= j) || baseSet.has(t.dataset.iri);
    t.classList.toggle('selected', on);
    if (on) selected.add(t.dataset.iri);
  });
  syncSelectMode();
}
function clearSelection(sync = true) {
  selected.forEach((iri) => { const t = tileByIri(iri); if (t) t.classList.remove('selected'); });
  selected.clear(); selectAnchor = null; _forceSelectMode = false;
  if (sync) syncSelectMode();
}
// Toque curto: abre (nada selecionado) ou alterna (já em seleção).
function handleTap(tile) {
  const rec = recordByIri.get(tile.dataset.iri); if (!rec) return;
  if (selectMode) toggleOne(tile.dataset.iri);
  else openLightbox(rec);
}

function wireGallery() {
  const gallery = $('#gallery');

  // Registra o tipo de ponteiro + arma o long-press no toque.
  gallery.addEventListener('pointerdown', (e) => {
    _downType = e.pointerType;
    const tile = e.target.closest('.tile');
    if (!tile) return;
    if (e.pointerType === 'touch') {
      _pressTile = tile; _pressXY = [e.clientX, e.clientY];
      clearTimeout(_pressTimer);
      _pressTimer = setTimeout(() => {                 // segurou → entra em seleção
        _pressTimer = null; dragSelecting = true;
        _dragBase = new Set(selected);
        selectAnchor = tile.dataset.iri;
        markSelected(selectAnchor, true); _dragBase.add(selectAnchor);
        syncSelectMode();
        if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) {} }
      }, LONGPRESS_MS);
    }
  });
  gallery.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'touch') return;
    if (_pressTimer && _pressXY) {                     // ainda esperando: se rolou, cancela
      if (Math.hypot(e.clientX - _pressXY[0], e.clientY - _pressXY[1]) > MOVE_TOL) {
        clearTimeout(_pressTimer); _pressTimer = null; _pressTile = null;
      }
      return;
    }
    if (!dragSelecting || !selectAnchor) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const tile = el && el.closest ? el.closest('#gallery .tile') : null;
    if (tile) selectRange(selectAnchor, tile.dataset.iri, _dragBase);
  });
  // Durante o drag-select, segura a rolagem (não-passivo pra poder preventDefault).
  gallery.addEventListener('touchmove', (e) => { if (dragSelecting && e.cancelable) e.preventDefault(); }, { passive: false });
  const endTouch = () => { dragSelecting = false; _dragBase = null; _pressTile = null; };
  gallery.addEventListener('pointerup', (e) => {
    if (e.pointerType !== 'touch') return;
    if (_pressTimer) {                                 // toque curto (long-press não disparou)
      clearTimeout(_pressTimer); _pressTimer = null;
      const tile = _pressTile; _pressTile = null;
      if (tile) handleTap(tile);
      return;
    }
    endTouch();
  });
  gallery.addEventListener('pointercancel', () => { if (_pressTimer) { clearTimeout(_pressTimer); _pressTimer = null; } endTouch(); });

  // Clique de mouse (o toque é tratado no pointerup acima).
  gallery.addEventListener('click', (e) => {
    if (_downType === 'touch') return;
    const tile = e.target.closest('.tile'); if (!tile) return;
    const iri = tile.dataset.iri;
    if (e.shiftKey && selectAnchor) selectRange(selectAnchor, iri, null);
    else if (e.metaKey || e.ctrlKey) toggleOne(iri);
    else selectOnly(iri);
  });
  gallery.addEventListener('dblclick', (e) => {
    if (_downType === 'touch') return;
    const tile = e.target.closest('.tile'); if (!tile) return;
    const rec = recordByIri.get(tile.dataset.iri); if (rec) openLightbox(rec);
  });
  gallery.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tile = e.target.closest('.tile'); if (!tile) return;
    e.preventDefault();
    const rec = recordByIri.get(tile.dataset.iri); if (rec) openLightbox(rec);
  });
  // Menu de contexto (botão direito) sobre as imagens — ver wireContextMenu.
  gallery.addEventListener('contextmenu', onGalleryContextMenu);

  // Clique/toque fora de qualquer foto e da UI de seleção → limpa a seleção.
  document.addEventListener('pointerdown', (e) => {
    if (!selected.size && !_forceSelectMode) return;
    if (e.target.closest('.tile, #selbar, .toolbar, #lightbox, .modal, #ctx-menu')) return;
    clearSelection();
  });
}

// ── Modo seleção ─────────────────────────────────────────────────────────────
// selectMode (checkboxes + barra de ação) fica ligado sempre que há algo
// selecionado, OU quando o botão "Selecionar" o força (0 itens, p/ descoberta).
function syncSelectMode() {
  const active = selected.size > 0 || _forceSelectMode;
  selectMode = active;
  $('#gallery').classList.toggle('select-mode', active);
  document.body.classList.toggle('select-mode', active);
  $('#btn-select').textContent = active ? 'Concluir' : 'Selecionar';
  $('#btn-select').classList.toggle('active', active);
  $('#btn-select-all').hidden = !active;
  $('#sel-count').hidden = !active;
  $('#selbar').hidden = !active || !TOUCH_UI;   // barra inferior só no toque
  updateSelUI();
}
function wireSelect() {
  $('#btn-select').addEventListener('click', () => {
    if (selectMode) clearSelection();                  // "Concluir"
    else { _forceSelectMode = true; syncSelectMode(); } // entra em seleção vazia
  });
  $('#btn-select-all').addEventListener('click', () => {
    $$('#gallery .tile').forEach((t) => { selected.add(t.dataset.iri); t.classList.add('selected'); });
    syncSelectMode();
  });
}
function updateSelUI() {
  const n = selected.size;
  const label = `${n} selecionada${n === 1 ? '' : 's'}`;
  $('#sel-count').textContent = label;
  const none = n === 0;
  ['#sel-share', '#sel-menu'].forEach((s) => { $(s).disabled = none; });
}

// ── Álbum (lista na barra de endereço) ───────────────────────────────────────
function parseAlbumRoute() {
  const m = location.pathname.match(ALBUM_PATH_RE);
  if (!m) return null;
  let slug = m[1];
  try { slug = decodeURIComponent(slug); } catch (_) {}
  return { slug, n: m[2] ? parseInt(m[2], 10) : null };
}
// URL do álbum (+ /<n>) na origem atual, preservando a query (menos ?list=,
// que o path substitui).
function albumUrl(slug, n) {
  const u = new URL(`imagens/lista/${encodeURIComponent(slug)}${n ? '/' + n : ''}`, document.baseURI);
  const qs = new URLSearchParams(location.search);
  qs.delete('list');
  u.search = qs.toString();
  return u.href;
}
// Faceta Listas com exatamente UMA lista → o IRI dela; senão null.
function singleListIri() {

}
// Barra de endereço ⇄ faceta Listas (a cada rebuildAndRun). UMA lista →
// /imagens/lista/<slug> (e a aba ganha o nome do álbum); saiu dela → volta pra
// /imagens.html. Não mexe em link compartilhado de seleção (?p=/?pick=).
function syncAlbumUrl() {
  if (!STANDALONE || pickSet) return;
  const iri = singleListIri();
  const slug = iri ? iri.slice(LIST_PREFIX.length) : null;
  if (slug === albumSlug) return;
  const wasAlbum = albumSlug != null || ALBUM_PATH_RE.test(location.pathname);
  albumSlug = slug;
  if (slug) {
    history.replaceState(history.state, '', albumUrl(slug));
    albumSequence(iri).catch(() => {});   // aquece: a 1ª foto aberta já sai com o /<n>
  } else if (wasAlbum) {
    const u = new URL('imagens.html', document.baseURI);
    const qs = new URLSearchParams(location.search);
    qs.delete('list');
    u.search = qs.toString();
    history.replaceState(history.state, '', u.href);
  }
  document.title = slug ? `${model.lists[iri] || slug} — ${PAGE_TITLE}` : PAGE_TITLE;
}
// Ordem CANÔNICA de um álbum = a da visão padrão dele (só a faceta da lista,
// agrupado por passeio — o que abre em /imagens/lista/<slug>), achatada. É ela
// que numera o /<n>: quem compartilha e quem recebe contam igual, seja qual
// for o agrupamento/filtro na tela de quem compartilhou. A ordem dentro dos
// grupos vem de canonicalRowOrder, e o backend a reproduz em _album_sequence

function albumSequence(listIri) {
  let p = _albumSeqCache.get(listIri);
  if (p) return p;

  const facets = { group: 'tour', lists: [listIri] };
  p = MQ.runQuery(store, MQ.buildQueryFromFacets(facets)).then((rows) => {
    const { groups, keys } = groupRows(rows, facets, null, true);
    const seen = new Set(), seq = [];
    for (const k of keys) {
      for (const r of groups.get(k).records) if (!seen.has(r.iri)) { seen.add(r.iri); seq.push(r.iri); }
    }
    if (gen === _dataGen) _albumSeqReady.set(listIri, seq);

function albumIndexSync(listIri, rec) {

}

function albumContextIri(rec) {

}
// Abre a n-ésima mídia (1-based) do álbum da barra de endereço (deep link
// /imagens/lista/<slug>/<n>, ou "avançar" do navegador de volta pra uma foto).
async function openAlbumItem(n, opts = {}) {
  if (!albumSlug) return;
  const slug = albumSlug;
  let seq;
  try { seq = await albumSequence(LIST_PREFIX + slug); } catch (_) { return; }
  if (albumSlug !== slug) return;
