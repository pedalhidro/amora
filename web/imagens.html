// ── Compartilhar link → galeria filtrada à seleção, sem agrupar, contínuo e
//    em colagem. Codifica cada mídia num token FIXO de 12 chars, sem separador:
//    1 char de tipo ('i'/'v') + 11 chars base64url do hash de 64 bits (16 hex).
//    Ex.: ?p=iha6…(11)vk2…(11)  — bem mais curto que image_<16hex>,video_….
//    (O formato antigo ?pick=image_…,video_… continua sendo aceito na leitura.)
function hexToB64url(hex) {
  let bin = '';
  for (let i = 0; i < hex.length; i += 2) bin += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlToHex(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  let hex = '';
  for (let i = 0; i < bin.length; i++) hex += bin.charCodeAt(i).toString(16).padStart(2, '0');
  return hex;
}
// Token de 12 chars: 1 char de tipo (vestigial — o IRI virou opaco med:<hash>,
// então o decode IGNORA esse char; fica só p/ manter o stride de 12 e por
// legibilidade) + 11 chars base64url do hash de 64 bits.
function encodeMediaToken(rec) {
  const hex = rec.iri.slice(MED.length);   // hash de 16 hex (sem prefixo)
  const type = rec.vhash ? 'v' : 'i';
  return type + hexToB64url(hex);
}
function decodeMediaToken(tok) {
  // Aceita tokens antigos (i/v + hash) e novos igualmente — só o hash importa.
  return MED + b64urlToHex(tok.slice(1));
}
function shareSelectedLink() {
  const recs = selectedRecords();
  if (!recs.length) return;
  const packed = recs.map((r) => encodeMediaToken(r)).join('');   // tokens de 12 chars, colados
  const url = new URL(location.href);
  url.hash = '';
  url.searchParams.delete('pick');
  url.searchParams.set('p', packed);
  const link = url.toString();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(
      () => toast(`✓ Link de ${recs.length} mídia${recs.length === 1 ? '' : 's'} copiado`),
      () => prompt('Copie o link:', link));
  } else {
    prompt('Copie o link:', link);
  }
}
// Link direto pra ESTA mídia (aberta no lightbox). Vendo um álbum (faceta
// Listas numa lista só, da qual a mídia faz parte): a foto DENTRO do álbum,
// /imagens/lista/<slug>/<n> — quem recebe cai nela e desliza pelo resto.
// Fora de álbum: ?pick=<hash>, consistente com o compartilhar do popup no
// mapa. Origem SEMPRE fixa em amora.pedalhidrografi.co (não location.href):
// um link compartilhado tem que funcionar pra quem recebe, mesmo testando em
// localhost. (O nº sai de albumSequence, já aquecida pelo openLightbox — o
// clipboard do Safari exige a escrita ainda dentro do toque, sem await.)
function shareLightboxLink() {
  if (!lbRecord) return;
  const ctx = albumContextIri(lbRecord);
  const n = albumIndexSync(ctx, lbRecord);
  let link, msg;
  if (n) {
    link = `${SHARE_ORIGIN}/imagens/lista/${encodeURIComponent(ctx.slice(LIST_PREFIX.length))}/${n}`;
    msg = `✓ Link copiado (mídia ${n} do álbum)`;
  } else {
    const hash = lbRecord.iri.slice(MED.length);
    link = `${SHARE_ORIGIN}/imagens.html?pick=${encodeURIComponent(hash)}`;
    msg = '✓ Link da mídia copiado';
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(
      () => toast(msg),
      () => prompt('Copie o link:', link));
  } else {
    prompt('Copie o link:', link);
  }
}
// Aviso passageiro no rodapé (funciona no desktop, onde a barra fica escondida).
let _toastT = null;
function toast(msg) {
  const el = $('#toast'); if (!el) return;
  el.textContent = msg; el.hidden = false;
  clearTimeout(_toastT);
  _toastT = setTimeout(() => { el.hidden = true; }, 1800);
}

// Adicionar/remover listas (lote) → POST /assign-media-lists. O mesmo modal
// serve os dois modos ('add' cria-na-hora; 'remove' só lista o que a seleção tem).
let assignMode = 'add';
function wireAssignModal() {
  $('#assign-close').addEventListener('click', closeAssignModal);
  $('#assign-backdrop').addEventListener('click', closeAssignModal);
  $('#assign-apply').addEventListener('click', applyAssign);
}
function openAssignModal() { openListModal('add'); }
function openUnassignModal() { openListModal('remove'); }
function openListModal(mode) {
  if (!selected.size) return;
  assignMode = mode;
  $('#assign-error').hidden = true;
  assignTS.clearOptions();
  assignTS.clear(true);
  if (mode === 'remove') {
    // Opções = união das listas presentes na seleção (nada de criar-na-hora).
    const present = new Set();
    selectedRecords().forEach((r) => (r.lists || []).forEach((l) => present.add(l)));
    assignTS.addOptions([...present].map((iri) => ({ value: iri, text: model.lists[iri] || short(iri) })));
    assignTS.settings.create = false;
    $('#assign-title').textContent = 'Remover das listas';
    $('#assign-desc').textContent = present.size
      ? 'Escolha listas para tirar da seleção.' : 'A seleção não está em nenhuma lista.';
    $('#assign-apply').textContent = 'Remover';
  } else {
    assignTS.addOptions(listOptions());
    assignTS.settings.create = mintListOption;   // religa a cunhagem de IRI (não `true`)
    $('#assign-title').textContent = 'Adicionar às listas';
    $('#assign-desc').textContent = 'Escolha listas existentes ou digite um nome novo para criar.';
    $('#assign-apply').textContent = 'Adicionar';
  }
  $('#assign-modal').hidden = false;
}
function closeAssignModal() { $('#assign-modal').hidden = true; }
async function applyAssign() {
  const listIris = assignTS.getValue();
  const recs = selectedRecords();
  if (!listIris.length || !recs.length) { closeAssignModal(); return; }
  const removing = assignMode === 'remove';
  const verb = removing ? 'Remover' : 'Adicionar';
  // Listas que ainda não existem no catálogo → declaradas em newLists (só no add).
  const newLists = removing ? [] : listIris.filter((li) => !model.lists[li])
    .map((li) => ({ iri: li, name: pendingNewLists.get(li) || short(li) }));
  const body = {
    iris: recs.map((r) => r.iri),
    add: removing ? [] : listIris,
    remove: removing ? listIris : [],
    newLists,
  };
  const btn = $('#assign-apply');
  btn.disabled = true; btn.textContent = removing ? 'Removendo…' : 'Adicionando…';
  try {
    const resp = await fetch('./assign-media-lists', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const j = await resp.json().catch(() => ({}));
    if (!resp.ok || j.error) throw new Error(j.error || 'HTTP ' + resp.status);
  } catch (e) {
    const el = $('#assign-error'); el.textContent = 'Falha: ' + e.message; el.hidden = false;
    btn.disabled = false; btn.textContent = verb;
    return;
  }
  btn.disabled = false; btn.textContent = verb;
  closeAssignModal();
  await refresh();
}

// Baixar seleção como ZIP (JSZip lazy).
async function downloadSelected() {
  const recs = selectedRecords();
  if (!recs.length) return;
  toast('Preparando…');
  let JSZip;
  try { JSZip = await ensureJSZip(); }
  catch (e) { showError('JSZip indisponível: ' + e.message); return; }
  const zip = new JSZip();
  let done = 0;
  for (const r of recs) {
    const files = [];   // [nomeNoZip, url]
    if (r.kind === 'image') {
      if (r.largeUrl) files.push([r.phash + (extDot(r.largeUrl) || '.jpg'), r.largeUrl]);
      if (r.fullUrl)  files.push([r.phash + '_original' + (extDot(r.fullUrl) || '.jpg'), r.fullUrl]);
    } else {
      if (r.clipUrl)  files.push([r.vhash + (extDot(r.clipUrl) || '.webm'), r.clipUrl]);
      if (r.audioUrl) files.push([r.vhash + '_audio' + (extDot(r.audioUrl) || '.webm'), r.audioUrl]);
    }
    for (const [name, url] of files) {
      try {
        const resp = await fetch(url);
        if (!resp.ok) continue;
        zip.file(name, await resp.blob());
      } catch (_) { /* arquivo indisponível — pula */ }
    }
    done++;
    toast(`Baixando ${done}/${recs.length}…`);
  }
  toast('Compactando…');
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `imagens_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// Excluir seleção → POST /delete-image|/delete-video.
async function deleteSelected() {
  const recs = selectedRecords();
  if (!recs.length) return;
  if (!confirm(`Excluir ${recs.length} mídia(s)? Isso remove arquivos e triples e não pode ser desfeito.`)) return;
  let done = 0, fail = 0;
  for (const r of recs) {
    const url = r.kind === 'image' ? `./delete-image/${r.phash}` : `./delete-video/${r.vhash}`;
    try { const resp = await fetch(url, { method: 'POST' }); if (!resp.ok) fail++; }
    catch (_) { fail++; }
    done++;
    toast(`Excluindo ${done}/${recs.length}…`);
  }
  selected.clear();
  await refresh();
  if (fail) showError(`${fail} exclusão(ões) falharam.`);
}

// ── Refresh após mutação: recarrega dados, re-roda consulta, avisa o mapa ─────
async function refresh() {
  try {
    await loadAndBuild();
  } catch (e) {
    showError('Falha ao recarregar dados: ' + e.message);
    return;
  }
  syncListOptions();
  if (albumSlug) albumSequence(LIST_PREFIX + albumSlug).catch(() => {});   // pertencimento pode ter mudado
  try { window.parent.postMessage({ type: 'phidro-gallery-reload' }, '*'); } catch (_) {}
  runAndRender(currentSparql, readFacets());
}

// ── Toolbar: grupo, avançado, limpar ─────────────────────────────────────────
function wireToolbar() {
  // Recolher/expandir o painel de filtros & agrupamento (padrão: recolhido no
  // celular). O botão + o "Selecionar" ficam sempre visíveis.
  const toolbar = document.querySelector('.toolbar');
  const saved = localStorage.getItem('phidro:filtersCollapsed');
  let filtersCollapsed = saved != null ? saved === '1'
    : window.matchMedia('(max-width: 760px)').matches;
  const applyCollapse = () => {
    toolbar.classList.toggle('collapsed', filtersCollapsed);
    $('#tb-toggle').setAttribute('aria-expanded', String(!filtersCollapsed));
  };
  applyCollapse();
  $('#tb-toggle').addEventListener('click', () => {
    filtersCollapsed = !filtersCollapsed;
    try { localStorage.setItem('phidro:filtersCollapsed', filtersCollapsed ? '1' : '0'); } catch (_) {}
    applyCollapse();
    if (galleryLayout === 'collage') layoutAllJustified();   // altura do header mudou
    if (overlayGroups) drawGroupPolygons();
  });
  // Estado inicial dos botões de agrupamento reflete currentGroup (pode vir de
  // ?pick=… como 'none') — não confia só no class="active" fixo do HTML.
  $$('#tb-group button').forEach((b) => b.classList.toggle('active', b.dataset.group === currentGroup));
  $('#tb-group').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-group]');
    if (!btn) return;
    currentGroup = btn.dataset.group;
    $$('#tb-group button').forEach((b) => b.classList.toggle('active', b === btn));
    rebuildAndRun();
  });
  // Toggle de layout (quadrado ↔ colagem justificada), persistido. Colagem e
  // "contínuo" agora coexistem (o polígono é traçado pelos retângulos reais).
  $$('#tb-layout button').forEach((b) => b.classList.toggle('active', b.dataset.layout === galleryLayout));
  $('#tb-layout').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-layout]');
    if (!btn) return;
    galleryLayout = btn.dataset.layout;
    try { localStorage.setItem('phidro:galleryLayout', galleryLayout); } catch (_) {}
    $$('#tb-layout button').forEach((b) => b.classList.toggle('active', b === btn));
    if (galleryWrap || overlayGroups) rerender();   // estrutura do DOM muda (contínuo)
    else applyGalleryLayout();
  });
  // Zoom das miniaturas: "+" = maiores (menos colunas), "−" = menores (mais).
  function updateZoomButtons() {
    $('#zoom-in').disabled = galleryZoom <= 0;                          // já no maior (1 col)
    $('#zoom-out').disabled = galleryZoom >= GALLERY_COLS.length - 1;   // já no menor (36 col)
  }
  function setZoom(idx) {
    galleryZoom = Math.max(0, Math.min(GALLERY_COLS.length - 1, idx));
    try { localStorage.setItem('phidro:galleryZoom', String(galleryZoom)); } catch (_) {}
    applyGalleryLayout();
    syncTileResolution();
    if (overlayGroups) requestAnimationFrame(drawGroupPolygons);   // grade mudou → redesenha
    updateZoomButtons();
  }
  $('#zoom-in').addEventListener('click', () => setZoom(galleryZoom - 1));
  $('#zoom-out').addEventListener('click', () => setZoom(galleryZoom + 1));
  updateZoomButtons();
  // Toggle "Contínuo" (grupos contornados por polígono, sem quebrar o fluxo).
  // Compatível com grade quadrada E colagem.
  const syncWrapBtn = () => {
    $('#tb-wrap').classList.toggle('active', galleryWrap);
    $('#tb-wrap').setAttribute('aria-pressed', String(galleryWrap));
  };
  syncWrapBtn();
  $('#tb-wrap').addEventListener('click', () => {
    galleryWrap = !galleryWrap;
    try { localStorage.setItem('phidro:galleryWrap', galleryWrap ? '1' : '0'); } catch (_) {}
    syncWrapBtn();
    rerender();
  });
  // Teclado: +/= aumenta, -/_ diminui (ignora ao digitar em campos, com o
  // lightbox aberto, ou com Ctrl/Cmd — que é o zoom do navegador).
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (t && ((t.matches && t.matches('input, textarea, select')) || t.isContentEditable)) return;
    if (!$('#lightbox').hidden) return;
    if (e.key === '+' || e.key === '=') { setZoom(galleryZoom - 1); e.preventDefault(); }
    else if (e.key === '-' || e.key === '_') { setZoom(galleryZoom + 1); e.preventDefault(); }
  });
  // Pinça (2 dedos) na galeria = zoom das miniaturas, tipo Apple Fotos:
  // afastar os dedos aumenta (menos colunas), aproximar diminui (mais colunas).
  // Passo a cada ~30% de variação da distância; o gesto continua a partir do
  // novo tamanho. touch-action:pan-x pan-y (no CSS) impede o zoom nativo aqui.
  const gallery = $('#gallery');
  let pinchDist0 = 0;
  const touchDist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  gallery.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) pinchDist0 = touchDist(e.touches);
  }, { passive: true });
  gallery.addEventListener('touchmove', (e) => {
    if (e.touches.length !== 2 || !pinchDist0) return;
    e.preventDefault();   // segura a rolagem/zoom nativo durante a pinça
    const ratio = touchDist(e.touches) / pinchDist0;
    if (ratio > 1.3) { setZoom(galleryZoom - 1); pinchDist0 = touchDist(e.touches); }
    else if (ratio < 0.77) { setZoom(galleryZoom + 1); pinchDist0 = touchDist(e.touches); }
  }, { passive: false });
  gallery.addEventListener('touchend', (e) => { if (e.touches.length < 2) pinchDist0 = 0; });
  // O zoom anima width/height do tile por CSS (.tile transition, 220ms). O
  // redraw imediato do setZoom (requestAnimationFrame) pega os tiles ainda a
  // meio caminho da transição, então o polígono do modo Contínuo (SVG
  // estático) fica desalinhado assim que a animação termina de assentar —
  // redesenha de novo quando a transição realmente acaba.
  gallery.addEventListener('transitionend', (e) => {
    if (e.target.classList?.contains('tile') && (e.propertyName === 'width' || e.propertyName === 'height')) {
      scheduleRelayout();
    }
  });
  window.addEventListener('resize', debounce(() => {
    if (galleryLayout === 'collage') layoutAllJustified();
    if (overlayGroups) drawGroupPolygons();
    syncTileResolution();
    refreshTimelineActive();
  }, 120));
}

// Linha do tempo: clique num marcador rola até o grupo; rolar a galeria
// (inclusive com a roda sobre a régua, que não captura o scroll vertical)
// atualiza o marcador ativo.
function wireTimeline() {
  $('#timeline').addEventListener('click', (e) => {
    const m = e.target.closest('.tl-mark');
    if (m) scrollToGroup(m.dataset.target);
  });
  let raf = 0;
  window.addEventListener('scroll', () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; refreshTimelineActive(); });
  }, { passive: true });
  $('#adv-apply').addEventListener('click', () => {
    const sparql = $('#adv-sparql').value;
    currentSparql = sparql;
    isCustom = true;
    $('#adv-flag').hidden = false;
    runAndRender(sparql, readFacets());   // dia-da-semana ainda é aplicado no cliente
  });
  $('#btn-clear').addEventListener('click', () => {
    ftLists.clear(true); ftAuthors.clear(true); ftUploaders.clear(true); ftTours.clear(true);
    $('#f-date-from').value = ''; $('#f-date-to').value = '';
    $('#f-kj-min').value = ''; $('#f-kj-max').value = '';
    dualDate && dualDate.syncFromEnds(); dualKj && dualKj.syncFromEnds();
    $$('#f-weekdays input').forEach((cb) => { cb.checked = false; });
    rebuildAndRun();
  });
}

// Link compartilhado: restringe a galeria à seleção e abre sem agrupar, em modo
// contínuo e colagem (estado só em memória, não grava). Aceita o formato compacto
// ?p=<tokens de 12 chars colados> e o legado ?pick=image_…,video_….
function applyPickParam() {
  const qs = new URLSearchParams(location.search);
  let iris = null;
  const packed = qs.get('p');
  if (packed) {
    iris = [];
    for (let i = 0; i + 12 <= packed.length; i += 12) {
      try { iris.push(decodeMediaToken(packed.slice(i, i + 12))); } catch (_) {}
    }
  } else {
    const raw = qs.get('pick');
    // Aceita ?pick=<hash> (novo) e o legado ?pick=image_<hash>/video_<hash>
    // (tira o prefixo — o IRI agora é opaco med:<hash>).
    if (raw) iris = raw.split(',').map((s) => s.trim()).filter(Boolean)
      .map((t) => MED + t.replace(/^(image_|video_)/, ''));
  }
  if (!iris || !iris.length) return;
  pickSet = new Set(iris);
  currentGroup = 'none';
  galleryWrap = true;
  galleryLayout = 'collage';
  const note = $('#pick-note');
  note.innerHTML = `<span>Mostrando ${pickSet.size} mídia${pickSet.size === 1 ? '' : 's'} de um link compartilhado.</span>` +
    `<button type="button" id="pick-clear" class="btn btn-ghost">Ver todas</button>`;
  note.hidden = false;
  $('#pick-clear').addEventListener('click', () => {
    pickSet = null; note.hidden = true;
    const u = new URL(location.href);
    u.searchParams.delete('p'); u.searchParams.delete('pick');
    history.replaceState(null, '', u);
    rerender();
  });
}

// Deep link por lista: /imagens/lista/<slug>[/<n>] (o álbum — é pra onde
// /listas/<slug>, o IRI dereferenciável, redireciona) ou o legado
// ?list=<slug>[,<slug>…] pré-selecionam a faceta Listas. Roda DEPOIS de
// buildFacetControls (ftLists já existe); o rebuildAndRun do boot então filtra
// (e o syncAlbumUrl dele troca um ?list=<slug> pelo path). Só aplica listas
// que existem no catálogo.
function applyListParam() {
  if (!ftLists) return;
  const route = parseAlbumRoute();
  const raw = route ? route.slug : new URLSearchParams(location.search).get('list');
  if (!raw) return;
  const iris = raw.split(',').map((s) => s.trim()).filter(Boolean)
    .map((s) => LIST_PREFIX + s).filter((iri) => model.lists[iri]);
  if (iris.length) ftLists.setValue(iris, true);   // silent — rebuildAndRun roda no boot
  else if (route) {
    const note = $('#pick-note');
    note.innerHTML = `<span>Álbum “${escapeHtml(route.slug)}” não encontrado — mostrando todas as mídias.</span>`;
    note.hidden = false;
  }
}

// ── Boot ─────────────────────────────────────────────────────────────────────
(async () => {
  try {
    embeddedSetup();
    await Promise.all([loadN3(), loadTomSelect()]);
    await loadAndBuild();
    // Lido ANTES do rebuildAndRun: o syncAlbumUrl dele reescreve a URL (tira o /<n>).
    const bootRoute = parseAlbumRoute();
    applyPickParam();          // antes dos controles p/ refletirem o estado do link
    buildFacetControls();
    applyListParam();          // /imagens/lista/<slug> ou ?list=<slug> → pré-seleciona a faceta Listas
    wireToolbar();
    wireTimeline();
    wireGallery();
    wireSelect();
    wireLightbox();
    wireSelbar();
    wireContextMenu();
    wireAssignModal();
    $('#status').hidden = true;
    $('.toolbar').hidden = false;
    // Visão padrão: agrupado por passeio, sem filtros (mostra TODAS as mídias).
    rebuildAndRun();
    // Link de UMA mídia só (ex.: "🔍 Ver grande" no popup do mapa): abre o
    // lightbox direto, sem exigir um clique a mais na grade filtrada. lbTS
    // só existe depois de buildFacetControls(), por isso isto roda aqui e
    // não dentro de applyPickParam().
    if (pickSet && pickSet.size === 1) {
      const rec = recordByIri.get([...pickSet][0]);
      if (rec) openLightbox(rec);
    } else {
      // /imagens/lista/<slug>/<n>: abre a n-ésima mídia do álbum.
      if (bootRoute && bootRoute.n && albumSlug) openAlbumItem(bootRoute.n);
    }
  } catch (e) {
    console.error(e);
    $('#status').innerHTML = `<span class="err">Falha ao iniciar: ${escapeHtml(e.message)}</span>`;
  }
})();
